<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Animasi Data Penelitian</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        #videoContainer {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #canvas {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 95vw;
            max-height: 95vh;
        }

        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.95);
            padding: 20px 30px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 100;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        #playPause {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
        }

        #playPause:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(102,126,234,0.4);
        }

        #restart {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        #restart:hover {
            transform: scale(1.05);
        }

        #chartToggle {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        #chartToggle:hover {
            transform: scale(1.05);
        }

        #variableToggle {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
        }

        #variableToggle:hover {
            transform: scale(1.05);
        }

        #progress {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.95);
            padding: 15px 30px;
            border-radius: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            font-weight: bold;
            color: #667eea;
            z-index: 100;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="videoContainer">
        <canvas id="canvas"></canvas>
        <div id="progress">Loading...</div>
        <div id="controls">
            <button id="variableToggle">Variabel X</button>
            <button id="playPause">▶ Play</button>
            <button id="restart">⟲ Restart</button>
            <button id="chartToggle">Diagram Batang</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const playPauseBtn = document.getElementById('playPause');
        const restartBtn = document.getElementById('restart');
        const chartToggleBtn = document.getElementById('chartToggle');
        const variableToggleBtn = document.getElementById('variableToggle');
        const progressDiv = document.getElementById('progress');

        canvas.width = 1280;
        canvas.height = 720;

        let isPlaying = false;
        let currentFrame = 0;
        let currentItem = 0;
        let chartType = 'bar'; // 'bar' or 'pie'
        let currentVariable = 'X';
        let animationProgress = 0;

        const COLORS = ['#ef4444', '#f97316', '#fbbf24', '#22c55e', '#10b981'];
        const FRAME_DURATION = 180; // frames per item (3 seconds at 60fps)
        const TRANSITION_FRAMES = 30;

        const dataVariabelX = [
            { no: 1, dimensi: "Kualitas Hiburan", indikator: "Saya merasa konten live streaming yang saya tonton menarik dan menyenangkan", STS: 2.8, TS: 5, N: 28.9, S: 24.4, SS: 38.9 },
            { no: 2, dimensi: "Kualitas Hiburan", indikator: "Saya merasa isi live streaming yang saya tonton mampu menghibur saya", STS: 3.3, TS: 4.4, N: 22.2, S: 31.7, SS: 38.3 },
            { no: 3, dimensi: "Gaya Streamer", indikator: "Saya menikmati gaya berbicara atau cara streamer menyampaikan konten", STS: 3.9, TS: 6.7, N: 25, S: 25, SS: 39.4 },
            { no: 4, dimensi: "Kesesuaian Minat", indikator: "Saya merasa tema atau topik live streaming sesuai dengan minat saya", STS: 4.4, TS: 8.3, N: 26.7, S: 26.7, SS: 33.9 },
            { no: 5, dimensi: "Suasana Siaran", indikator: "Saya merasa live streaming yang saya tonton memiliki suasana yang seru dan tidak membosankan", STS: 3.9, TS: 3.3, N: 28.9, S: 28.9, SS: 35 },
            { no: 6, dimensi: "Suasana Siaran", indikator: "Saya menikmati kelucuan, spontanitas, atau tingkah laku menghibur dari streamer", STS: 1.7, TS: 4.4, N: 22.8, S: 26.1, SS: 45 },
            { no: 7, dimensi: "Kualitas Teknis", indikator: "Saya merasa kualitas gambar dan suara mendukung keseruan saat menonton", STS: 2.8, TS: 2.8, N: 26.1, S: 27.8, SS: 40.6 },
            { no: 8, dimensi: "Interaksi Siaran", indikator: "Saya merasa interaksi antara streamer dan penonton membuat suasana lebih hidup", STS: 1.7, TS: 4.4, N: 26.1, S: 27.2, SS: 40.6 },
            { no: 9, dimensi: "Suasana Positif", indikator: "Saya merasa streamer mampu menciptakan suasana yang positif selama siaran", STS: 1.7, TS: 6.1, N: 31.1, S: 25, SS: 36.1 },
            { no: 10, dimensi: "Dampak Emosional", indikator: "Saya merasa konten hiburan yang disajikan membuat saya betah menonton lebih lama", STS: 2.8, TS: 5, N: 29.4, S: 26.7, SS: 36.1 },
            { no: 11, dimensi: "Dampak Emosional", indikator: "Saya merasa live streaming yang saya tonton dapat menghilangkan rasa penat atau stress", STS: 2.2, TS: 4.4, N: 29.4, S: 29.4, SS: 34.4 },
            { no: 12, dimensi: "Ketertarikan Berulang", indikator: "Saya merasa konten hiburan yang saya tonton membuat saya ingin menonton kembali di lain waktu", STS: 2.8, TS: 8.9, N: 27.8, S: 30.6, SS: 30 }
        ];

        const dataVariabelY = [
            { no: 1, dimensi: "Loyalitas Menonton", indikator: "Saya sering menonton live streaming dari streamer yang sama", STS: 5.6, TS: 13.9, N: 32.2, S: 24.4, SS: 23.9 },
            { no: 2, dimensi: "Loyalitas Menonton", indikator: "Saya merasa terikat dengan streamer yang sering saya tonton", STS: 10.6, TS: 20, N: 35.6, S: 18.3, SS: 15.6 },
            { no: 3, dimensi: "Ketertarikan Platform", indikator: "Saya mengikuti akun streamer favorit di berbagai platform", STS: 11.7, TS: 13.9, N: 28.9, S: 30, SS: 15.6 },
            { no: 4, dimensi: "Antusiasme Siaran", indikator: "Saya menunggu jadwal siaran streamer favorit dengan antusias", STS: 11.7, TS: 20.6, N: 31.1, S: 20, SS: 16.7 },
            { no: 5, dimensi: "Antusiasme Siaran", indikator: "Saya merasa senang saat streamer favorit saya melakukan siaran langsung", STS: 5.6, TS: 6.1, N: 35.6, S: 29.4, SS: 23.3 },
            { no: 6, dimensi: "Interaksi Aktif", indikator: "Saya sering berinteraksi melalui komentar selama live streaming", STS: 13.9, TS: 16.7, N: 27.2, S: 23.3, SS: 18.9 },
            { no: 7, dimensi: "Dukungan Finansial", indikator: "Saya pernah memberikan dukungan berupa gift, donasi, atau bentuk lainnya saat menonton", STS: 26.1, TS: 15.6, N: 27.2, S: 17.2, SS: 13.9 },
            { no: 8, dimensi: "Dukungan Finansial", indikator: "Saya merasa tidak keberatan mengeluarkan sedikit uang untuk mendukung streamer favorit saya", STS: 22.8, TS: 14.4, N: 36.1, S: 16.1, SS: 10.6 },
            { no: 9, dimensi: "Dukungan Finansial", indikator: "Saya memberikan donasi sebagai bentuk apresiasi terhadap usaha streamer dalam menghibur", STS: 17.8, TS: 13.3, N: 31.1, S: 20, SS: 17.8 },
            { no: 10, dimensi: "Komitmen Dukungan", indikator: "Saya ingin membantu streamer favorit saya agar terus aktif membuat konten", STS: 7.2, TS: 10.6, N: 40, S: 23.9, SS: 18.3 },
            { no: 11, dimensi: "Komitmen Dukungan", indikator: "Saya tetap menonton dan mendukung streamer favorit meskipun ada banyak streamer baru", STS: 4.4, TS: 5.6, N: 32.8, S: 30, SS: 27.2 },
            { no: 12, dimensi: "Ketanggapan Sebagai Fans", indikator: "Saya merasa bangga bisa menjadi bagian dari penonton yang ikut mendukung streamer favorit saya", STS: 5.6, TS: 3.9, N: 41.7, S: 22.2, SS: 26.7 }
        ];

        let currentData = dataVariabelX;

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#f8fafc');
            gradient.addColorStop(1, '#e0e7ff');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawTitle(item) {
            ctx.save();
            
            // Title background
            const titleGradient = ctx.createLinearGradient(0, 30, 0, 150);
            titleGradient.addColorStop(0, '#667eea');
            titleGradient.addColorStop(1, '#764ba2');
            ctx.fillStyle = titleGradient;
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 20;
            ctx.shadowOffsetY = 10;
            roundRect(ctx, 40, 30, canvas.width - 80, 120, 20);
            ctx.fill();
            ctx.shadowColor = 'transparent';

            // Title text
            ctx.fillStyle = 'white';
            ctx.font = 'bold 32px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`VARIABEL ${currentVariable}`, canvas.width / 2, 70);
            
            ctx.font = 'bold 20px Arial';
            ctx.fillText(`Item ${item.no} - ${item.dimensi}`, canvas.width / 2, 100);
            
            ctx.font = '16px Arial';
            const maxWidth = canvas.width - 120;
            const text = item.indikator;
            if (ctx.measureText(text).width > maxWidth) {
                const words = text.split(' ');
                let line = '';
                let y = 130;
                for (let word of words) {
                    const testLine = line + word + ' ';
                    if (ctx.measureText(testLine).width > maxWidth) {
                        ctx.fillText(line, canvas.width / 2, y);
                        line = word + ' ';
                        y += 20;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line, canvas.width / 2, y);
            } else {
                ctx.fillText(text, canvas.width / 2, 130);
            }

            ctx.restore();
        }

        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        function drawBarChart(item, progress) {
            const data = [
                { name: 'STS', value: item.STS, label: 'Sangat Tidak Setuju' },
                { name: 'TS', value: item.TS, label: 'Tidak Setuju' },
                { name: 'N', value: item.N, label: 'Netral' },
                { name: 'S', value: item.S, label: 'Setuju' },
                { name: 'SS', value: item.SS, label: 'Sangat Setuju' }
            ];

            const chartX = 100;
            const chartY = 220;
            const chartWidth = canvas.width - 200;
            const chartHeight = 350;
            const barWidth = (chartWidth - 100) / 5;
            const maxValue = 50;

            // Draw axes
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(chartX, chartY);
            ctx.lineTo(chartX, chartY + chartHeight);
            ctx.lineTo(chartX + chartWidth, chartY + chartHeight);
            ctx.stroke();

            // Draw grid
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 5; i++) {
                const y = chartY + chartHeight - (chartHeight * i / 5);
                ctx.beginPath();
                ctx.moveTo(chartX, y);
                ctx.lineTo(chartX + chartWidth, y);
                ctx.stroke();
                
                ctx.fillStyle = '#64748b';
                ctx.font = '14px Arial';
                ctx.textAlign = 'right';
                ctx.fillText((maxValue * i / 5).toFixed(0) + '%', chartX - 10, y + 5);
            }

            // Draw bars with animation
            data.forEach((d, i) => {
                const x = chartX + 50 + i * barWidth;
                const barHeight = (d.value / maxValue) * chartHeight * easeInOutCubic(progress);
                const y = chartY + chartHeight - barHeight;

                // Bar shadow
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 5;

                // Bar gradient
                const gradient = ctx.createLinearGradient(x, y, x, chartY + chartHeight);
                gradient.addColorStop(0, COLORS[i]);
                gradient.addColorStop(1, COLORS[i] + 'AA');
                ctx.fillStyle = gradient;
                
                roundRect(ctx, x, y, barWidth - 20, barHeight, 10);
                ctx.fill();

                ctx.shadowColor = 'transparent';

                // Value on top of bar
                if (progress > 0.5) {
                    ctx.fillStyle = '#1e293b';
                    ctx.font = 'bold 18px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(d.value.toFixed(1) + '%', x + (barWidth - 20) / 2, y - 10);
                }

                // Label below bar
                ctx.fillStyle = '#334155';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(d.name, x + (barWidth - 20) / 2, chartY + chartHeight + 25);
                
                ctx.font = '12px Arial';
                ctx.fillStyle = '#64748b';
                const words = d.label.split(' ');
                let line = '';
                let yPos = chartY + chartHeight + 45;
                for (let word of words) {
                    const testLine = line + word + ' ';
                    if (ctx.measureText(testLine).width > barWidth - 10) {
                        ctx.fillText(line.trim(), x + (barWidth - 20) / 2, yPos);
                        line = word + ' ';
                        yPos += 15;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line.trim(), x + (barWidth - 20) / 2, yPos);
            });
        }

        function drawPieChart(item, progress) {
            const data = [
                { name: 'STS', value: item.STS, label: 'Sangat Tidak Setuju' },
                { name: 'TS', value: item.TS, label: 'Tidak Setuju' },
                { name: 'N', value: item.N, label: 'Netral' },
                { name: 'S', value: item.S, label: 'Setuju' },
                { name: 'SS', value: item.SS, label: 'Sangat Setuju' }
            ];

            const total = data.reduce((sum, d) => sum + d.value, 0);
            const centerX = canvas.width / 2 - 150;
            const centerY = 400;
            const radius = 150;

            let startAngle = -Math.PI / 2;

            // Draw pie slices
            data.forEach((d, i) => {
                const sliceAngle = (d.value / total) * 2 * Math.PI * easeInOutCubic(progress);
                const endAngle = startAngle + sliceAngle;

                // Slice shadow
                ctx.save();
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 15;
                ctx.shadowOffsetX = 5;
                ctx.shadowOffsetY = 5;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = COLORS[i];
                ctx.fill();

                ctx.restore();

                // Label line and text
                if (progress > 0.7) {
                    const labelAngle = startAngle + sliceAngle / 2;
                    const labelX = centerX + Math.cos(labelAngle) * (radius + 40);
                    const labelY = centerY + Math.sin(labelAngle) * (radius + 40);

                    ctx.strokeStyle = COLORS[i];
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(centerX + Math.cos(labelAngle) * radius, centerY + Math.sin(labelAngle) * radius);
                    ctx.lineTo(labelX, labelY);
                    ctx.stroke();

                    ctx.fillStyle = '#1e293b';
                    ctx.font = 'bold 16px Arial';
                    ctx.textAlign = labelX > centerX ? 'left' : 'right';
                    ctx.fillText(d.name + ': ' + d.value.toFixed(1) + '%', labelX + (labelX > centerX ? 10 : -10), labelY);
                }

                startAngle = endAngle;
            });

            // Draw legend
            const legendX = canvas.width / 2 + 100;
            const legendY = 250;
            data.forEach((d, i) => {
                const y = legendY + i * 50;

                // Legend color box
                ctx.fillStyle = COLORS[i];
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 5;
                roundRect(ctx, legendX, y, 30, 30, 5);
                ctx.fill();
                ctx.shadowColor = 'transparent';

                // Legend text
                ctx.fillStyle = '#1e293b';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'left';
                ctx.fillText(d.label, legendX + 45, y + 12);
                
                ctx.font = '14px Arial';
                ctx.fillStyle = '#64748b';
                ctx.fillText(d.value.toFixed(1) + '%', legendX + 45, y + 28);
            });
        }

        function drawFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            const item = currentData[currentItem];
            const frameInItem = currentFrame % FRAME_DURATION;
            const progress = Math.min(frameInItem / TRANSITION_FRAMES, 1);

            drawTitle(item);

            if (chartType === 'bar') {
                drawBarChart(item, progress);
            } else {
                drawPieChart(item, progress);
            }

            // Progress indicator
            ctx.fillStyle = 'rgba(102, 126, 234, 0.8)';
            const progressWidth = (canvas.width - 100) * ((currentItem * FRAME_DURATION + frameInItem) / (currentData.length * FRAME_DURATION));
            roundRect(ctx, 50, canvas.height - 40, progressWidth, 10, 5);
            ctx.fill();

            progressDiv.textContent = `Item ${currentItem + 1}/${currentData.length} | Variabel ${currentVariable}`;
        }

        function animate() {
            if (isPlaying) {
                drawFrame();
                currentFrame++;

                if (currentFrame >= FRAME_DURATION) {
                    currentFrame = 0;
                    currentItem++;
                    if (currentItem >= currentData.length) {
                        currentItem = 0;
                    }
                }

                requestAnimationFrame(animate);
            }
        }

        playPauseBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playPauseBtn.textContent = isPlaying ? '⏸ Pause' : '▶ Play';
            if (isPlaying) {
                animate();
            }
        });

        restartBtn.addEventListener('click', () => {
            currentFrame = 0;
            currentItem = 0;
            drawFrame();
        });

        chartToggleBtn.addEventListener('click', () => {
            chartType = chartType === 'bar' ? 'pie' : 'bar';
            chartToggleBtn.textContent = chartType === 'bar' ? 'Diagram Batang' : 'Diagram Lingkaran';
            drawFrame();
        });

        variableToggleBtn.addEventListener('click', () => {
            currentVariable = currentVariable === 'X' ? 'Y' : 'X';
            currentData = currentVariable === 'X' ? dataVariabelX : dataVariabelY;
            variableToggleBtn.textContent = `Variabel ${currentVariable}`;
            currentItem = 0;
            currentFrame = 0;
            drawFrame();
        });

        // Initial draw
        drawFrame();
    </script>
</body>
</html>
